name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Smoke test
        # No audio device is created here — these are the commands that work headless.
        run: |
          ./.build/release/screend version
          ./.build/release/screend list
          ./.build/release/screend status
